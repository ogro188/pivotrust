[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pivotradar-platform"
version = "0.1.0"
description = "Plataforma Python agnostica para estrategias de deteccion (motor PivotRadar Rust + motor de referencia Python)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45"]
rust = ["maturin>=1.4"]

[tool.setuptools.packages.find]
include = ["pivotradar_platform*"]
